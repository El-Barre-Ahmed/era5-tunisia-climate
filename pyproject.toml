[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "era5-tunisia-climate"
version = "0.1.0"
description = "Acquisition, validation et préparation des données ERA5 pour la Tunisie"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cdsapi>=0.7.7,<1.0",
    "xarray>=2024.10,<2027",
    "netCDF4>=1.7,<2.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<4.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["era5_tunisia"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
